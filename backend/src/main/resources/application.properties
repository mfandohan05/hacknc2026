spring.application.name=backend

# Railway/Render inject PORT; Spring doesn't bind to it automatically.
server.port=${PORT:8080}

# Comma-separated browser origins; includes Vite's common fallback port and the deployed Vercel frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,https://hacknc2026-six.vercel.app}

spring.config.import=optional:file:../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

mapbox.access-token=${MAPBOX_ACCESS_TOKEN:}
google.routes.api-key=${GOOGLE_ROUTES_API_KEY:}

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_JWT_ISSUER}

spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256
spring.security.oauth2.resourceserver.jwt.audiences=authenticated
