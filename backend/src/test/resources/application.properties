# Test config: use an in-memory H2 database so the build doesn't need Supabase.
# Overrides src/main/resources/application.properties on the test classpath.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Placeholder only: satisfies the JwtDecoder auto-config condition so the context
# loads in tests. Never actually fetched — no test exercises real JWT validation,
# and the decoder is only built lazily on first use.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.test/.well-known/jwks.json
